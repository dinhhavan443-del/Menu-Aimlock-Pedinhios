<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>🔑 ADMIN KEY</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{min-height:100vh;background:#050a12;display:flex;justify-content:center;align-items:center;font-family:-apple-system,'Segoe UI',sans-serif;padding:10px}
        .container{width:100%;max-width:420px;background:#0c1624;border-radius:40px;padding:24px;border:1px solid rgba(61,212,181,0.08);box-shadow:0 20px 80px rgba(0,0,0,0.8);animation:slideUp 0.6s ease-out}
        @keyframes slideUp{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}
        .header{text-align:center;padding-bottom:12px}
        .logo{font-size:40px;display:block;animation:float 3s ease-in-out infinite}
        @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
        .title{font-size:24px;font-weight:800;color:#e8f0f5}
        .title span{color:#3dd4b5}
        .sub{color:#3a5a5a;font-size:11px}
        .badge{display:inline-block;background:rgba(61,212,181,0.08);padding:2px 12px;border-radius:40px;font-size:9px;color:#3dd4b5;border:1px solid rgba(61,212,181,0.06);margin-top:4px}
        .section{background:rgba(10,20,30,0.6);border-radius:20px;padding:16px;margin:12px 0;border:1px solid rgba(255,255,255,0.02)}
        .section-title{color:#e8f0f5;font-size:14px;font-weight:700;margin-bottom:10px}
        .label{color:#3a5a5a;font-size:11px;display:block;margin:6px 0 4px}
        .input{width:100%;padding:12px 14px;border-radius:20px;border:1px solid rgba(61,212,181,0.08);background:#0a141e;color:#b8c8d4;font-size:13px;outline:none}
        .input:focus{border-color:rgba(61,212,181,0.3)}
        .input::placeholder{color:#3a4a56}
        .btn{width:100%;padding:12px;border:none;border-radius:28px;background:linear-gradient(135deg,#3dd4b5,#2a9a8a);color:#0a121a;font-size:14px;font-weight:700;cursor:pointer;transition:all 0.3s;margin-top:8px}
        .btn:active{transform:scale(0.95)}
        .btn-danger{background:linear-gradient(135deg,#d45a5a,#a04040)}
        .btn-sm{padding:6px 14px;width:auto;font-size:11px;margin:0 4px}
        .tb-grid{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0}
        .tb-option{padding:6px 14px;border-radius:14px;background:#0a141e;color:#4a5a66;font-size:12px;font-weight:600;cursor:pointer;border:1px solid rgba(255,255,255,0.02);transition:all 0.3s}
        .tb-option.active{background:#3dd4b5;color:#0a121a}
        .tb-option:hover{background:rgba(61,212,181,0.1)}
        .custom-input{display:flex;gap:8px;margin-top:4px}
        .custom-input input{flex:1;padding:8px 12px;border-radius:14px;border:1px solid rgba(61,212,181,0.08);background:#0a141e;color:#b8c8d4;font-size:13px;outline:none;text-align:center}
        .custom-input input:focus{border-color:rgba(61,212,181,0.3)}
        .custom-input input::placeholder{color:#3a4a56}
        .key-item{background:#0a141e;border-radius:16px;padding:12px;margin:8px 0;border:1px solid rgba(255,255,255,0.02);animation:slideUp 0.4s ease-out}
        .key-code{color:#3dd4b5;font-size:12px;font-family:monospace;word-break:break-all}
        .key-info{display:flex;justify-content:space-between;flex-wrap:wrap;font-size:10px;color:#3a5a5a;margin-top:4px}
        .key-info .status{color:#3dd4b5}
        .key-info .expire{color:#d4b83a}
        .key-actions{display:flex;gap:4px;margin-top:8px;flex-wrap:wrap}
        .empty{color:#3a5a5a;text-align:center;padding:20px;font-size:12px}
        .toast{padding:10px;border-radius:16px;background:rgba(61,212,181,0.04);border:1px solid rgba(61,212,181,0.06);font-size:12px;color:#7ab8a8;text-align:center;margin:8px 0}
        .toast.hidden{display:none}
        .toast.error{background:rgba(212,90,90,0.04);border-color:rgba(212,90,90,0.06);color:#d45a5a}
        .footer{text-align:center;font-size:10px;color:#1a2a2a;margin-top:10px}
        .footer span{color:#2a4a4a}
        .flex{display:flex;gap:8px}
        .flex .btn{flex:1}
        .badge-keys{display:inline-block;background:#3dd4b5;color:#0a121a;padding:0 10px;border-radius:12px;font-size:10px;font-weight:700;margin-left:6px}
        .copy-btn{background:rgba(61,212,181,0.08);border:1px solid rgba(61,212,181,0.1);color:#3dd4b5}
        .copy-btn:hover{background:rgba(61,212,181,0.15)}
        .time-input{display:flex;gap:8px;align-items:center}
        .time-input input{width:80px;padding:8px 12px;border-radius:14px;border:1px solid rgba(61,212,181,0.08);background:#0a141e;color:#b8c8d4;font-size:13px;outline:none;text-align:center}
        .time-input input:focus{border-color:rgba(61,212,181,0.3)}
        .time-input span{color:#3a5a5a;font-size:12px}
        .quick-times{display:flex;gap:4px;flex-wrap:wrap;margin:4px 0}
        .quick-times .tb-option{font-size:10px;padding:4px 10px}
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div class="logo">🔑</div>
        <div class="title">KEY <span>ADMIN</span></div>
        <div class="sub">Tạo key cho app AIMLOCK</div>
        <span class="badge">● ONLINE</span>
    </div>

    <!-- ===== TẠO KEY ===== -->
    <div class="section">
        <div class="section-title">📝 Tạo Key Mới</div>

        <!-- SỐ TB - TÙY CHỈNH -->
        <label class="label">Số thiết bị (TB)</label>
        <div class="tb-grid" id="tbGrid">
            <span class="tb-option active" data-tb="1">1</span>
            <span class="tb-option" data-tb="2">2</span>
            <span class="tb-option" data-tb="3">3</span>
            <span class="tb-option" data-tb="5">5</span>
            <span class="tb-option" data-tb="10">10</span>
            <span class="tb-option" data-tb="20">20</span>
            <span class="tb-option" data-tb="50">50</span>
            <span class="tb-option" data-tb="100">100</span>
        </div>
        
        <!-- TÙY CHỈNH TB THỦ CÔNG -->
        <div class="custom-input">
            <input type="number" id="customTB" placeholder="Nhập số TB tùy ý" min="1" max="9999" />
            <button class="btn btn-sm" id="setCustomTB" style="width:auto;padding:8px 16px;margin:0">✅ Áp dụng</button>
        </div>

        <!-- THỜI HẠN - TÙY CHỈNH -->
        <label class="label" style="margin-top:8px">Thời hạn</label>
        
        <!-- Các lựa chọn nhanh -->
        <div class="quick-times" id="timeGrid">
            <span class="tb-option" data-time="1">1 ngày</span>
            <span class="tb-option" data-time="3">3 ngày</span>
            <span class="tb-option" data-time="7">7 ngày</span>
            <span class="tb-option active" data-time="30">30 ngày</span>
            <span class="tb-option" data-time="90">90 ngày</span>
            <span class="tb-option" data-time="180">180 ngày</span>
            <span class="tb-option" data-time="365">365 ngày</span>
        </div>

        <!-- TÙY CHỈNH SỐ NGÀY THỦ CÔNG -->
        <div class="custom-input">
            <input type="number" id="customDays" placeholder="Nhập số ngày tùy ý" min="1" max="9999" />
            <span style="color:#3a5a5a;font-size:12px;display:flex;align-items:center">ngày</span>
            <button class="btn btn-sm" id="setCustomDays" style="width:auto;padding:8px 16px;margin:0">✅ Áp dụng</button>
        </div>

        <label class="label">Tên người dùng</label>
        <input type="text" id="usernameInput" class="input" placeholder="Tên người dùng" value="Pedinhios" />

        <button class="btn" id="btnCreateKey">🚀 TẠO KEY</button>
        <div id="createResult" class="toast hidden"></div>
    </div>

    <!-- ===== DANH SÁCH KEY ===== -->
    <div class="section">
        <div class="section-title">
            📋 Danh sách key
            <span class="badge-keys" id="keyCount">0</span>
        </div>
        <div id="keyList">
            <div class="empty">Chưa có key nào</div>
        </div>
        <div class="flex">
            <button class="btn btn-danger" id="btnClearAll">🗑 Xóa tất cả</button>
            <button class="btn" id="btnRefresh">🔄 Làm mới</button>
        </div>
    </div>

    <div class="footer">📱 <span>Zalo: 0862937139</span> · Pedinhios</div>
</div>

<script>
// ============================================================
// KEY ADMIN - TÙY CHỈNH TB + SỐ NGÀY
// ============================================================

// ===== STATE =====
let selectedTB = 1;
let selectedDays = 30;
let keys = [];

// ===== DOM =====
const tbGrid = document.getElementById('tbGrid');
const timeGrid = document.getElementById('timeGrid');
const customTB = document.getElementById('customTB');
const setCustomTB = document.getElementById('setCustomTB');
const customDays = document.getElementById('customDays');
const setCustomDays = document.getElementById('setCustomDays');
const usernameInput = document.getElementById('usernameInput');
const btnCreateKey = document.getElementById('btnCreateKey');
const createResult = document.getElementById('createResult');
const keyList = document.getElementById('keyList');
const keyCount = document.getElementById('keyCount');
const btnClearAll = document.getElementById('btnClearAll');
const btnRefresh = document.getElementById('btnRefresh');

// ===== LOAD KEYS =====
function loadKeys() {
    try {
        const saved = localStorage.getItem('tipa_keys');
        if (saved) {
            keys = JSON.parse(saved);
        } else {
            keys = [];
            saveKeys();
        }
    } catch(e) {
        keys = [];
    }
    renderKeys();
}

function saveKeys() {
    localStorage.setItem('tipa_keys', JSON.stringify(keys));
    renderKeys();
}

// ===== TẠO KEY =====
function generateKey() {
    const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
    let random = '';
    for (let i = 0; i < 6; i++) {
        random += chars.charAt(Math.floor(Math.random() * chars.length));
    }
    const now = new Date();
    const dateStr = now.getFullYear() +
        String(now.getMonth() + 1).padStart(2, '0') +
        String(now.getDate()).padStart(2, '0');
    return `ANHDINH-${dateStr}-TB${selectedTB}-${random}`;
}

function getExpireDate() {
    const now = new Date();
    const expire = new Date(now.getTime() + selectedDays * 24 * 60 * 60 * 1000);
    return expire.toISOString().replace('T', ' ').slice(0, 19);
}

function formatDate(dateStr) {
    const d = new Date(dateStr);
    return d.getDate() + '/' + (d.getMonth() + 1) + '/' + d.getFullYear() + ' ' +
        String(d.getHours()).padStart(2, '0') + ':' +
        String(d.getMinutes()).padStart(2, '0');
}

function handleCreateKey() {
    const username = usernameInput.value.trim() || 'Pedinhios';
    const newKey = generateKey();
    const expire = getExpireDate();
    
    const keyData = {
        key: newKey,
        user: username,
        tb: selectedTB,
        days: selectedDays,
        createdAt: new Date().toISOString(),
        expire: expire
    };
    
    keys.unshift(keyData);
    saveKeys();
    
    createResult.className = 'toast';
    createResult.textContent = `✅ Tạo key thành công!\n📱 TB: ${selectedTB}\n⏳ ${selectedDays} ngày\n🔑 ${newKey}`;
    createResult.classList.remove('hidden');
    
    setTimeout(() => {
        createResult.classList.add('hidden');
    }, 5000);
}

// ===== XÓA KEY =====
function deleteKey(index) {
    if (confirm('Xóa key này?')) {
        keys.splice(index, 1);
        saveKeys();
    }
}

function clearAllKeys() {
    if (keys.length === 0) return;
    if (confirm('Xóa tất cả key?')) {
        keys = [];
        saveKeys();
    }
}

// ===== COPY KEY =====
function copyKey(key) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(key).then(() => {
            showToast('📋 Đã copy: ' + key);
        }).catch(() => {
            fallbackCopy(key);
        });
    } else {
        fallbackCopy(key);
    }
}

function fallbackCopy(key) {
    const textarea = document.createElement('textarea');
    textarea.value = key;
    textarea.style.position = 'fixed';
    textarea.style.opacity = '0';
    document.body.appendChild(textarea);
    textarea.select();
    try {
        document.execCommand('copy');
        showToast('📋 Đã copy: ' + key);
    } catch(e) {
        alert('📋 Key: ' + key);
    }
    document.body.removeChild(textarea);
}

function showToast(msg) {
    const toast = document.createElement('div');
    toast.className = 'toast';
    toast.textContent = msg;
    toast.style.position = 'fixed';
    toast.style.bottom = '20px';
    toast.style.left = '50%';
    toast.style.transform = 'translateX(-50%)';
    toast.style.maxWidth = '90%';
    toast.style.zIndex = '999';
    document.body.appendChild(toast);
    setTimeout(() => toast.remove(), 2500);
}

// ===== RENDER KEYS =====
function renderKeys() {
    keyCount.textContent = keys.length;
    
    if (keys.length === 0) {
        keyList.innerHTML = '<div class="empty">Chưa có key nào</div>';
        return;
    }
    
    let html = '';
    keys.forEach((item, index) => {
        const isExpired = new Date(item.expire) < new Date();
        const status = isExpired ? '⏹ Hết hạn' : '✔ Hoạt động';
        const statusColor = isExpired ? '#d45a5a' : '#3dd4b5';
        
        html += `
            <div class="key-item">
                <div class="key-code">${item.key}</div>
                <div class="key-info">
                    <span>👤 ${item.user}</span>
                    <span class="status" style="color:${statusColor}">${status}</span>
                    <span class="expire">📅 ${formatDate(item.expire)}</span>
                    <span>📱 TB: ${item.tb}</span>
                    <span>⏳ ${item.days || '?'} ngày</span>
                </div>
                <div class="key-actions">
                    <button class="btn btn-sm copy-btn" onclick="copyKey('${item.key}')">📋 COPY</button>
                    <button class="btn btn-sm btn-danger" onclick="deleteKey(${index})">🗑 XÓA</button>
                </div>
            </div>
        `;
    });
    keyList.innerHTML = html;
}

// ===== SET TB =====
function setTB(value) {
    selectedTB = parseInt(value);
    if (isNaN(selectedTB) || selectedTB < 1) selectedTB = 1;
    customTB.value = selectedTB;
    
    tbGrid.querySelectorAll('.tb-option').forEach(el => {
        el.classList.toggle('active', parseInt(el.dataset.tb) === selectedTB);
    });
}

// ===== SET DAYS =====
function setDays(value) {
    selectedDays = parseInt(value);
    if (isNaN(selectedDays) || selectedDays < 1) selectedDays = 1;
    customDays.value = selectedDays;
    
    timeGrid.querySelectorAll('.tb-option').forEach(el => {
        el.classList.toggle('active', parseInt(el.dataset.time) === selectedDays);
    });
}

// ===== EVENTS =====
// Chọn TB từ grid
tbGrid.querySelectorAll('.tb-option').forEach(el => {
    el.addEventListener('click', function() {
        setTB(parseInt(this.dataset.tb));
    });
});

// Chọn ngày từ grid
timeGrid.querySelectorAll('.tb-option').forEach(el => {
    el.addEventListener('click', function() {
        setDays(parseInt(this.dataset.time));
    });
});

// Custom TB
setCustomTB.addEventListener('click', function() {
    const val = parseInt(customTB.value);
    if (val && val > 0) {
        setTB(val);
        showToast('✅ Đã đặt TB: ' + val);
    } else {
        showToast('⚠️ Vui lòng nhập số TB hợp lệ!');
    }
});

customTB.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') setCustomTB.click();
});

// Custom Days
setCustomDays.addEventListener('click', function() {
    const val = parseInt(customDays.value);
    if (val && val > 0) {
        setDays(val);
        showToast('✅ Đã đặt số ngày: ' + val);
    } else {
        showToast('⚠️ Vui lòng nhập số ngày hợp lệ!');
    }
});

customDays.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') setCustomDays.click();
});

// Tạo key
btnCreateKey.addEventListener('click', handleCreateKey);
usernameInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') handleCreateKey();
});

// Xóa tất cả
btnClearAll.addEventListener('click', clearAllKeys);

// Làm mới
btnRefresh.addEventListener('click', loadKeys);

// ===== EXPOSE GLOBALLY =====
window.deleteKey = deleteKey;
window.copyKey = copyKey;

// ===== INIT =====
loadKeys();
setTB(1);
setDays(30);
console.log('🔑 KEY ADMIN - Tùy chỉnh TB + ngày');
console.log('📱 Zalo: 0862937139');
</script>

</body>
</html>
