<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>AIMLOCK · ADMIN + UNLOCK</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            background: #050a12;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: -apple-system, 'Segoe UI', system-ui, sans-serif;
            padding: 10px;
        }

        /* ===== CONTAINER CHÍNH ===== */
        .container {
            width: 100%;
            max-width: 420px;
            background: #0c1624;
            border-radius: 32px;
            padding: 20px 16px;
            border: 2px solid rgba(61, 212, 181, 0.15);
            box-shadow: 0 0 40px rgba(61, 212, 181, 0.05), 0 20px 80px rgba(0, 0, 0, 0.8);
            position: relative;
            z-index: 1;
            max-height: 98vh;
            overflow-y: auto;
        }
        .container::-webkit-scrollbar { width: 2px; }
        .container::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.05); border-radius: 10px; }

        /* ===== TAB ===== */
        .tab-bar {
            display: flex;
            gap: 6px;
            margin-bottom: 16px;
            background: #0a141e;
            border-radius: 28px;
            padding: 4px;
            border: 1px solid rgba(255, 255, 255, 0.03);
        }
        .tab-btn {
            flex: 1;
            padding: 10px 0;
            border: none;
            border-radius: 24px;
            background: transparent;
            color: #4a5a66;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        .tab-btn.active {
            background: #1a2a3a;
            color: #b8c8d4;
            box-shadow: 0 4px 20px rgba(61, 212, 181, 0.04);
        }
        .tab-btn:active { transform: scale(0.95); }
        .tab-btn .icon { font-size: 16px; display: block; margin-bottom: 2px; }

        .tab-content { display: none; animation: slideUp 0.4s ease; }
        .tab-content.active { display: block; }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ===== UNLOCK ===== */
        .logo { font-size: 40px; text-align: center; display: block; margin-bottom: 4px; }
        .title { text-align: center; color: #e8f0f5; font-size: 22px; font-weight: 800; }
        .title span { color: #3dd4b5; }
        .sub { text-align: center; color: #3a5a5a; font-size: 11px; margin-bottom: 14px; }
        .input-key {
            width: 100%;
            padding: 14px 18px;
            border-radius: 32px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            background: #0a141e;
            color: #b8c8d4;
            font-size: 14px;
            outline: none;
            text-align: center;
            font-family: monospace;
            transition: all 0.3s;
        }
        .input-key:focus {
            border-color: rgba(61, 212, 181, 0.3);
            box-shadow: 0 0 30px rgba(61, 212, 181, 0.05);
        }
        .btn-primary {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 32px;
            background: linear-gradient(135deg, #3dd4b5, #2a9a8a);
            color: #0a121a;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 10px;
            transition: all 0.3s;
        }
        .btn-primary:active { transform: scale(0.96); }
        .btn-danger {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 32px;
            background: #2a1a1a;
            color: #d45a5a;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 8px;
            transition: all 0.3s;
            border: 1px solid rgba(212, 90, 90, 0.1);
        }
        .btn-danger:active { transform: scale(0.96); }
        .error { color: #d45a5a; font-size: 12px; margin-top: 8px; min-height: 18px; text-align: center; }
        .debug-info {
            font-size: 9px;
            color: #3a5a5a;
            margin-top: 8px;
            padding: 4px 8px;
            background: rgba(10, 20, 30, 0.4);
            border-radius: 12px;
            word-break: break-all;
            text-align: center;
        }
        .debug-info span { color: #3dd4b5; }
        .zalo { text-align: center; color: #2a4a4a; font-size: 10px; margin-top: 12px; }
        .zalo span { color: #3a6a6a; }

        /* ===== ADMIN ===== */
        .admin-section { margin-bottom: 14px; }
        .admin-section label {
            color: #6a8a98;
            font-size: 11px;
            font-weight: 600;
            display: block;
            margin-bottom: 4px;
        }
        .admin-section .row {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .admin-section .row .input-sm {
            flex: 1;
            min-width: 60px;
            padding: 10px 12px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            background: #0a141e;
            color: #b8c8d4;
            font-size: 13px;
            outline: none;
            text-align: center;
            transition: all 0.3s;
        }
        .admin-section .row .input-sm:focus {
            border-color: rgba(61, 212, 181, 0.3);
        }
        .admin-section .row .input-sm::placeholder { color: #3a4a56; font-size: 11px; }
        .admin-section .row .btn-sm {
            padding: 10px 16px;
            border: none;
            border-radius: 20px;
            background: #1a2a3a;
            color: #b8c8d4;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        .admin-section .row .btn-sm:active { transform: scale(0.95); }
        .admin-section .row .btn-sm.green { background: #1a2a2a; color: #3dd4b5; border: 1px solid rgba(61, 212, 181, 0.1); }

        .tb-btns {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }
        .tb-btns .tb-btn {
            padding: 6px 12px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 16px;
            background: #0a141e;
            color: #4a5a66;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        .tb-btns .tb-btn:active { transform: scale(0.95); }
        .tb-btns .tb-btn.active {
            background: #1a2a3a;
            border-color: rgba(61, 212, 181, 0.12);
            color: #3dd4b5;
        }

        .day-btns {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }
        .day-btns .day-btn {
            padding: 6px 12px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 16px;
            background: #0a141e;
            color: #4a5a66;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        .day-btns .day-btn:active { transform: scale(0.95); }
        .day-btns .day-btn.active {
            background: #1a2a3a;
            border-color: rgba(61, 212, 181, 0.12);
            color: #3dd4b5;
        }

        .key-list {
            margin-top: 12px;
            max-height: 300px;
            overflow-y: auto;
        }
        .key-list::-webkit-scrollbar { width: 2px; }
        .key-list::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.05); border-radius: 10px; }
        .key-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 12px;
            background: #0a141e;
            border-radius: 16px;
            margin-bottom: 4px;
            border: 1px solid rgba(255, 255, 255, 0.02);
            flex-wrap: wrap;
            gap: 4px;
        }
        .key-item .info {
            font-size: 10px;
            color: #4a5a66;
            flex: 1;
            min-width: 120px;
        }
        .key-item .info .key-text { color: #b8c8d4; font-weight: 600; font-family: monospace; font-size: 11px; }
        .key-item .info .key-detail { color: #3a5a5a; font-size: 9px; }
        .key-item .info .key-detail .tb { color: #3dd4b5; }
        .key-item .actions {
            display: flex;
            gap: 4px;
        }
        .key-item .actions .act-btn {
            padding: 4px 10px;
            border: none;
            border-radius: 12px;
            font-size: 9px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        .key-item .actions .act-btn:active { transform: scale(0.95); }
        .key-item .actions .act-btn.copy { background: rgba(61, 212, 181, 0.1); color: #3dd4b5; }
        .key-item .actions .act-btn.del { background: rgba(212, 90, 90, 0.1); color: #d45a5a; }

        .admin-tools {
            display: flex;
            gap: 8px;
            margin-top: 10px;
        }
        .admin-tools .btn-tool {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            background: #0a141e;
            color: #4a5a66;
            border: 1px solid rgba(255, 255, 255, 0.02);
        }
        .admin-tools .btn-tool:active { transform: scale(0.95); }
        .admin-tools .btn-tool.danger { color: #d45a5a; border-color: rgba(212, 90, 90, 0.05); }

        .toast {
            margin-top: 10px;
            padding: 10px 14px;
            border-radius: 20px;
            background: rgba(61, 212, 181, 0.03);
            border: 1px solid rgba(61, 212, 181, 0.04);
            color: #7ab8a8;
            font-size: 12px;
            text-align: center;
            min-height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.4s;
        }

        .status-badge {
            display: inline-block;
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 8px;
            font-weight: 600;
        }
        .status-badge.active { background: rgba(61, 212, 181, 0.1); color: #3dd4b5; }
        .status-badge.expired { background: rgba(212, 90, 90, 0.1); color: #d45a5a; }

        .footer-text {
            text-align: center;
            font-size: 8px;
            color: #16202a;
            margin-top: 12px;
            letter-spacing: 0.8px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- ===== TAB ===== -->
        <div class="tab-bar">
            <button class="tab-btn active" data-tab="unlock">
                <span class="icon">🔑</span> Unlock
            </button>
            <button class="tab-btn" data-tab="admin">
                <span class="icon">⚙️</span> Admin
            </button>
        </div>

        <!-- ===== TAB UNLOCK ===== -->
        <div class="tab-content active" id="tab-unlock">
            <span class="logo">🔑</span>
            <div class="title">AIM<span>LOCK</span></div>
            <div class="sub">Nhập key để kích hoạt · Anh Định</div>
            <input class="input-key" id="keyInput" placeholder="ANHDINH-YYYYMMDD-TBX-XXXXXX" autofocus />
            <button class="btn-primary" id="loginBtn">▶ XÁC THỰC</button>
            <div class="error" id="loginError"></div>
            <div class="debug-info" id="debugInfo">🔍 Đang kiểm tra...</div>
            <div class="zalo">📱 Zalo: <span>0862937139</span> · Anh Định</div>
        </div>

        <!-- ===== TAB ADMIN ===== -->
        <div class="tab-content" id="tab-admin">
            <div class="title" style="font-size:18px;margin-bottom:12px;">⚙️ <span>TẠO KEY</span></div>

            <!-- TB -->
            <div class="admin-section">
                <label>📱 Số thiết bị (TB)</label>
                <div class="tb-btns" id="tbBtns">
                    <button class="tb-btn active" data-tb="1">1</button>
                    <button class="tb-btn" data-tb="2">2</button>
                    <button class="tb-btn" data-tb="3">3</button>
                    <button class="tb-btn" data-tb="5">5</button>
                    <button class="tb-btn" data-tb="10">10</button>
                    <button class="tb-btn" data-tb="20">20</button>
                    <button class="tb-btn" data-tb="50">50</button>
                </div>
            </div>

            <!-- Days -->
            <div class="admin-section">
                <label>⏳ Thời hạn</label>
                <div class="day-btns" id="dayBtns">
                    <button class="day-btn" data-days="1">1 ngày</button>
                    <button class="day-btn" data-days="3">3 ngày</button>
                    <button class="day-btn" data-days="7">7 ngày</button>
                    <button class="day-btn active" data-days="30">30 ngày</button>
                    <button class="day-btn" data-days="90">90 ngày</button>
                    <button class="day-btn" data-days="180">180 ngày</button>
                    <button class="day-btn" data-days="365">365 ngày</button>
                </div>
            </div>

            <!-- User -->
            <div class="admin-section">
                <label>👤 Tên người dùng</label>
                <input class="input-key" id="userInput" placeholder="Pedinhios" style="text-align:left;font-family:sans-serif;font-size:14px;" />
            </div>

            <button class="btn-primary" id="createKeyBtn">▶ TẠO KEY</button>

            <!-- Danh sách key -->
            <div style="margin-top:14px;">
                <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">
                    <span style="color:#3a5a5a;font-size:11px;font-weight:600;">📋 Danh sách key (<span id="keyCount">0</span>)</span>
                    <div style="display:flex;gap:4px;">
                        <button class="act-btn" id="refreshKeys" style="background:rgba(61,212,181,0.05);color:#3a5a5a;border:none;padding:3px 10px;border-radius:10px;font-size:9px;cursor:pointer;">🔄 Làm mới</button>
                    </div>
                </div>
                <div class="key-list" id="keyList">
                    <div style="color:#3a5a5a;font-size:10px;text-align:center;padding:12px;">Chưa có key nào</div>
                </div>
                <div style="display:flex;gap:6px;margin-top:8px;">
                    <button class="btn-tool danger" id="deleteAllKeys">🗑️ Xóa tất cả</button>
                </div>
            </div>

            <div class="toast" id="adminToast">✅ Sẵn sàng</div>
            <div class="footer-text">AIMLOCK · ADMIN + UNLOCK</div>
        </div>
    </div>

    <script>
        // ============================================================
        // GỘP ADMIN + UNLOCK
        // ============================================================

        // ===== DOM =====
        var keyInput = document.getElementById('keyInput');
        var loginBtn = document.getElementById('loginBtn');
        var loginError = document.getElementById('loginError');
        var debugInfo = document.getElementById('debugInfo');
        var keyList = document.getElementById('keyList');
        var keyCount = document.getElementById('keyCount');
        var userInput = document.getElementById('userInput');
        var createKeyBtn = document.getElementById('createKeyBtn');
        var adminToast = document.getElementById('adminToast');
        var refreshKeys = document.getElementById('refreshKeys');
        var deleteAllKeys = document.getElementById('deleteAllKeys');

        var selectedTb = 1;
        var selectedDays = 30;

        // ===== TAB =====
        document.querySelectorAll('.tab-btn').forEach(function(btn) {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.tab-btn').forEach(function(b) { b.classList.remove('active'); });
                this.classList.add('active');
                var tab = this.dataset.tab;
                document.querySelectorAll('.tab-content').forEach(function(c) { c.classList.remove('active'); });
                document.getElementById('tab-' + tab).classList.add('active');
                if (tab === 'admin') renderKeys();
            });
        });

        // ===== TB =====
        document.querySelectorAll('#tbBtns .tb-btn').forEach(function(btn) {
            btn.addEventListener('click', function() {
                document.querySelectorAll('#tbBtns .tb-btn').forEach(function(b) { b.classList.remove('active'); });
                this.classList.add('active');
                selectedTb = parseInt(this.dataset.tb);
            });
        });

        // ===== DAYS =====
        document.querySelectorAll('#dayBtns .day-btn').forEach(function(btn) {
            btn.addEventListener('click', function() {
                document.querySelectorAll('#dayBtns .day-btn').forEach(function(b) { b.classList.remove('active'); });
                this.classList.add('active');
                selectedDays = parseInt(this.dataset.days);
            });
        });

        // ============================================================
        // KEY FUNCTIONS
        // ============================================================
        function getKeys() {
            try {
                var saved = localStorage.getItem('tipa_keys');
                if (saved) {
                    var keys = JSON.parse(saved);
                    if (keys && keys.length > 0) return keys;
                }
            } catch (e) { console.log('Lỗi đọc key:', e); }
            return [];
        }

        function saveKeys(keys) {
            localStorage.setItem('tipa_keys', JSON.stringify(keys));
        }

        function generateKey() {
            var chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
            var result = '';
            for (var i = 0; i < 6; i++) {
                result += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            return result;
        }

        function createKey() {
            var username = userInput.value.trim() || 'Pedinhios';
            var date = new Date();
            var yyyy = date.getFullYear();
            var mm = String(date.getMonth() + 1).padStart(2, '0');
            var dd = String(date.getDate()).padStart(2, '0');
            var random = generateKey();
            var key = 'ANHDINH-' + yyyy + mm + dd + '-TB' + selectedTb + '-' + random;

            var expireDate = new Date();
            expireDate.setDate(expireDate.getDate() + selectedDays);

            var keys = getKeys();
            keys.push({
                key: key,
                expire: expireDate.toISOString(),
                tb: selectedTb,
                days: selectedDays,
                user: username
            });
            saveKeys(keys);
            renderKeys();
            showAdminToast('✅ Đã tạo key: ' + key, 'success');
            return key;
        }

        function deleteKey(keyToDelete) {
            var keys = getKeys();
            keys = keys.filter(function(k) { return k.key !== keyToDelete; });
            saveKeys(keys);
            renderKeys();
            showAdminToast('🗑️ Đã xóa key', 'success');
        }

        function deleteAllKeys() {
            if (confirm('⚠️ Bạn có chắc muốn xóa TẤT CẢ key?')) {
                saveKeys([]);
                renderKeys();
                showAdminToast('🗑️ Đã xóa tất cả key', 'success');
            }
        }

        function copyKey(key) {
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(key).then(function() {
                    showAdminToast('📋 Đã copy: ' + key, 'success');
                }).catch(function() {
                    fallbackCopy(key);
                });
            } else {
                fallbackCopy(key);
            }
        }

        function fallbackCopy(text) {
            var textarea = document.createElement('textarea');
            textarea.value = text;
            document.body.appendChild(textarea);
            textarea.select();
            try {
                document.execCommand('copy');
                showAdminToast('📋 Đã copy: ' + text, 'success');
            } catch (e) {
                showAdminToast('❌ Không thể copy', 'error');
            }
            document.body.removeChild(textarea);
        }

        // ===== RENDER =====
        function renderKeys() {
            var keys = getKeys();
            keyCount.textContent = keys.length;

            if (keys.length === 0) {
                keyList.innerHTML = '<div style="color:#3a5a5a;font-size:10px;text-align:center;padding:12px;">Chưa có key nào</div>';
                return;
            }

            var html = '';
            var now = new Date();
            for (var i = 0; i < keys.length; i++) {
                var k = keys[i];
                var expireDate = new Date(k.expire);
                var isValid = expireDate > now;
                var status = isValid ?
                    '<span class="status-badge active">● Hoạt động</span>' :
                    '<span class="status-badge expired">● Hết hạn</span>';

                var daysLeft = Math.ceil((expireDate.getTime() - now.getTime()) / (1000 * 60 * 60 * 24));
                var daysText = isValid ? daysLeft + ' ngày' : 'Hết hạn';

                html += `
                    <div class="key-item">
                        <div class="info">
                            <div class="key-text">${k.key}</div>
                            <div class="key-detail">
                                👤 ${k.user || 'Pedinhios'} · 
                                <span class="tb">${k.tb || 1} TB</span> · 
                                ${k.days || 365} ngày · 
                                ${daysText}
                            </div>
                            <div style="margin-top:2px;">${status}</div>
                        </div>
                        <div class="actions">
                            <button class="act-btn copy" onclick="copyKey('${k.key}')">COPY</button>
                            <button class="act-btn del" onclick="deleteKey('${k.key}')">XÓA</button>
                        </div>
                    </div>
                `;
            }
            keyList.innerHTML = html;
        }

        // ===== ADMIN TOAST =====
        function showAdminToast(msg, type) {
            adminToast.textContent = msg;
            adminToast.style.color = type === 'success' ? '#7ab8a8' : '#d45a5a';
            clearTimeout(adminToast._timer);
            adminToast._timer = setTimeout(function() {
                adminToast.textContent = '✅ Sẵn sàng';
                adminToast.style.color = '#7ab8a8';
            }, 3000);
        }

        // ============================================================
        // UNLOCK
        // ============================================================
        function isValidKey(key) {
            if (!key) return { valid: false, reason: '⚠️ Vui lòng nhập key' };
            var keys = getKeys();
            if (keys.length === 0) {
                debugInfo.innerHTML = '⚠️ Chưa có key nào! <span style="color:#d4b83a;">Hãy tạo key trên Admin.</span>';
                return { valid: false, reason: '❌ Chưa có key nào!' };
            }
            var found = keys.find(function(item) { return item.key === key; });
            if (!found) {
                debugInfo.innerHTML = '❌ Key <span style="color:#d45a5a;">' + key + '</span> không tồn tại!';
                return { valid: false, reason: '❌ Key không tồn tại!' };
            }
            var expireDate = new Date(found.expire);
            var now = new Date();
            if (expireDate < now) {
                debugInfo.innerHTML = '⏹ Key <span style="color:#d45a5a;">' + key + '</span> đã hết hạn!';
                return { valid: false, reason: '❌ Key đã hết hạn!' };
            }
            debugInfo.innerHTML = '✅ Key <span>' + key + '</span> hợp lệ! TB: ' + found.tb + ' · ' + found.days + ' ngày';
            return { valid: true, expire: expireDate, tb: found.tb || 1, user: found.user || 'Pedinhios' };
        }

        function doLogin() {
            var inputKey = keyInput.value.trim();
            if (!inputKey) { loginError.textContent = '⚠️ Vui lòng nhập key'; return; }
            var result = isValidKey(inputKey);
            if (result.valid) {
                loginError.textContent = '';
                loginError.style.color = '#3dd4b5';
                loginError.textContent = '✅ Đăng nhập thành công! TB: ' + result.tb + ' · Còn ' + Math.ceil((result.expire.getTime() - new Date().getTime()) / (1000 * 60 * 60 * 24)) + ' ngày';
                debugInfo.innerHTML = '✅ Chào mừng ' + (result.user || 'Pedinhios') + '! Key: <span>' + inputKey + '</span>';
                showAdminToast('✅ Đăng nhập thành công!', 'success');
            } else {
                loginError.textContent = '❌ ' + result.reason;
                loginError.style.color = '#d45a5a';
                keyInput.style.animation = 'shake 0.5s ease';
                setTimeout(function() { keyInput.style.animation = ''; }, 500);
            }
        }

        // ============================================================
        // EVENTS
        // ============================================================
        keyInput.addEventListener('keydown', function(e) { if (e.key === 'Enter') doLogin(); });
        loginBtn.addEventListener('click', doLogin);
        createKeyBtn.addEventListener('click', createKey);
        refreshKeys.addEventListener('click', renderKeys);
        deleteAllKeys.addEventListener('click', deleteAllKeys);
